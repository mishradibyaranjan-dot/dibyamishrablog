name: Security Scan

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    # Daily re-scan so newly published advisories surface even without commits.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (blocks on high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security scan
        run: bun run security:scan

  visitor-tracking:
    name: Visitor tracking RLS guard (blocks on regressions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Guard visitor_logs / visitors security posture
        run: bun run security:visitor-tracking

  theme-tokens:
    name: Theme token lint (blocks on hardcoded colors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Learn/chat/theme UI uses semantic theme tokens
        run: bun run theme:lint

      - name: Theme token unit tests
        run: bunx vitest run src/components/theme
